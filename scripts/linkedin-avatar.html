<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face {
    font-family: 'Cormorant Garamond';
    font-style: normal;
    font-weight: 500 600;
    src: url('../public/fonts/cormorant-garamond-latin.woff2') format('woff2');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* LinkedIn company logo: square, 400x400 spec — rendered at 400 and 2x.
     Everything sits inside the central circle so it survives any
     circular crop (messages, some mobile surfaces). */
  body {
    width: 400px;
    height: 400px;
    background: #faf9f5;
    position: relative;
    overflow: hidden;
  }

  .stack {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .amp {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: 252px;
    line-height: 0.82;
    color: #c2552c;
    /* optical centering: Cormorant's & sits a touch low and left */
    transform: translateX(2px);
  }

  .bar {
    width: 92px;
    height: 7px;
    background: linear-gradient(90deg, #c2552c 0%, #e8c87f 55%, #8a6415 100%);
  }
</style>
</head>
<body>
  <div class="stack">
    <div class="amp">&amp;</div>
    <div class="bar"></div>
  </div>
</body>
</html>
