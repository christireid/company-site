<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face {
    font-family: 'Cormorant Garamond';
    font-style: italic;
    font-weight: 500;
    src: url('../public/fonts/cormorant-garamond-italic-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Cormorant Garamond';
    font-style: normal;
    font-weight: 500 600;
    src: url('../public/fonts/cormorant-garamond-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'DM Mono';
    font-style: normal;
    font-weight: 500;
    src: url('../public/fonts/dm-mono-medium-latin.woff2') format('woff2');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* LinkedIn company cover: 1128 x 191 */
  body {
    width: 1128px;
    height: 191px;
    background: #faf9f5;
    overflow: hidden;
    position: relative;
  }

  /* Composition sits center, nudged right — the page logo overlaps the
     bottom-left of the cover on desktop, so that corner stays quiet. */
  .stack {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-left: 64px; /* optical nudge right, away from logo overlap */
    gap: 14px;
  }

  .headline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 46px;
    line-height: 1;
    color: #141413;
    letter-spacing: 0.005em;
  }
  .headline .accent { color: #a8451f; }

  .kicker {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 11.5px;
    letter-spacing: 0.18em;
    color: #605c53;
  }
  .kicker .tick {
    width: 26px;
    height: 2px;
    background: linear-gradient(90deg, #c2552c 0%, #e8c87f 55%, #8a6415 100%);
  }
  .kicker .dot { color: #c2552c; padding: 0 2px; }

  .url {
    position: absolute;
    right: 28px;
    bottom: 16px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.10em;
    color: #605c53;
  }

  .rule {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 4px;
    background: linear-gradient(90deg, #c2552c 0%, #e8c87f 55%, #8a6415 100%);
  }
</style>
</head>
<body>
  <div class="stack">
    <div class="headline">A decision, <span class="accent">not a deck.</span></div>
    <div class="kicker">
      <span class="tick"></span>
      <span>AI IMPLEMENTATION</span><span class="dot">·</span>
      <span>STRATEGY, AUDITS &amp; GOVERNANCE</span><span class="dot">·</span>
      <span>TRAINING &amp; CAPABILITY</span>
      <span class="tick"></span>
    </div>
  </div>
  <div class="url">codeclarity.ai</div>
  <div class="rule"></div>
</body>
</html>
